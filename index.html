<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>提示词图库</title>
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --line:#2c313c;
  --text:#e8eaf0; --sub:#9aa3b2; --accent:#e85d75; --accent2:#ff8fa3;
  --ok:#3ddc97; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* ===== 登录页 ===== */
#loginView{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
#loginView.active{display:flex}
.loginBox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 28px;box-shadow:var(--shadow)}
.loginBox h1{font-size:24px;margin-bottom:6px;letter-spacing:1px}
.loginBox .sub{color:var(--sub);font-size:13px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.field input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;outline:none}
.field input:focus{border-color:var(--accent)}
.btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:12px;padding:13px;font-size:16px;font-weight:600}
.btn:active{opacity:.85}
.err{color:#ff6b6b;font-size:13px;min-height:18px;margin-top:10px;text-align:center}
.hint{color:var(--sub);font-size:12px;text-align:center;margin-top:16px}

/* ===== 主界面 ===== */
#mainView{display:none}
#mainView.active{display:block}
header{position:sticky;top:0;z-index:50;background:rgba(15,17,21,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 14px}
.headerRow{display:flex;align-items:center;gap:10px}
header h1{font-size:18px;flex:1;white-space:nowrap}
#logoutBtn{color:var(--sub);font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
#searchBar{width:100%;margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;outline:none}
#searchBar:focus{border-color:var(--accent)}
.tagRow{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.tagRow::-webkit-scrollbar{display:none}
.tagChip{flex-shrink:0;background:var(--card2);border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:6px 14px;font-size:13px}
.tagChip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{color:var(--sub);font-size:12px;padding:0 14px 8px}

#list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 8px 100px}
@media(min-width:640px){#list{grid-template-columns:repeat(3,1fr);gap:12px;padding:0 14px 100px}}
@media(min-width:1024px){#list{grid-template-columns:repeat(4,1fr);gap:14px}}
@media(max-width:639px){.cardBody{display:none}.card,.cardImgWrap{border-radius:10px}.cardImgWrap .imgCount{right:4px;top:4px;padding:2px 5px;font-size:9px}}
.cardActs{display:flex;gap:8px;padding:8px}
.cardActs .actBtn{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:8px 0;font-size:12px}
.cardActs .actBtn:active{background:var(--accent);color:#fff}
.noimgPrompt{font-size:12px;color:var(--text);line-height:1.45;padding:8px 10px 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.editLabelRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.editLabelRow label{margin-bottom:0}
.pasteBtn{background:var(--card2);border:1px solid var(--line);color:var(--accent2);border-radius:8px;padding:4px 12px;font-size:12px;flex-shrink:0}
.pasteBtn:active{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.cardImgWrap{position:relative;aspect-ratio:3/4;background:var(--card2);overflow:hidden}
.cardImgWrap img{width:100%;height:100%;object-fit:cover;display:block}
.cardImgWrap .noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--sub);font-size:13px}
.cardImgWrap .imgCount{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:3px 8px;font-size:11px}
.cardBody{padding:12px 14px 14px}
.cardPrompt{font-size:13px;color:var(--text);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.cardTags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cardTags span{background:var(--card2);color:var(--accent2);border-radius:6px;padding:3px 8px;font-size:11px}
.cardFoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.copyBtn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--sub)}
.copyBtn:active{background:var(--accent);color:#fff}
.cardDate{color:var(--sub);font-size:11px}

/* ===== 详情弹层 ===== */
#detailMask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;overflow-y:auto}
#detailMask.open{display:block}
.detailBox{max-width:680px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:80px}
.detailHead{position:sticky;top:0;background:rgba(15,17,21,.95);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);z-index:5}
.detailHead .back{font-size:22px;color:var(--text)}
.detailHead .t{font-size:16px;flex:1}
.detailImgs{display:grid;grid-template-columns:1fr;gap:12px;padding:14px}
.detailImgs img{width:100%;border-radius:12px;display:block;background:var(--card2)}
.detailSection{padding:0 16px 20px}
.detailSection h3{font-size:13px;color:var(--sub);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.detailSection h3::after{content:"";flex:1;height:1px;background:var(--line)}
.promptText{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.variantBox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;position:relative}
.tagList{display:flex;flex-wrap:wrap;gap:8px}
.tagList span{background:var(--card2);color:var(--accent2);border-radius:8px;padding:5px 12px;font-size:12px}
.bigBtn{display:block;width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:600;margin-top:6px}
.bigBtn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.detailMeta{color:var(--sub);font-size:11px;text-align:center;margin-top:16px;line-height:1.8}

/* 全屏看图 */
#zoomMask{display:none;position:fixed;inset:0;background:#000;z-index:200;align-items:center;justify-content:center;touch-action:none}
#zoomMask.open{display:flex}
#zoomMask img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
#zoomCount{position:fixed;top:18px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.55);padding:4px 14px;border-radius:999px;font-size:13px;z-index:202}
#zoomHint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.55);font-size:12px;z-index:202;pointer-events:none;white-space:nowrap}
#zoomClose{position:fixed;top:14px;right:18px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;border:none;font-size:22px;line-height:38px;z-index:202;cursor:pointer}

.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.loadingMask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;display:flex;align-items:center;justify-content:center}
.loadingBox{background:#fff;border-radius:14px;padding:24px 32px;text-align:center;color:#333;font-size:14px}
.loadingBox p{margin:10px 0 0}
.spin{width:32px;height:32px;margin:0 auto;border:3px solid #e0e0e0;border-top-color:#e0636c;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast.show{opacity:1}
.loading{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}

/* ===== 新增：日期/筛选行 ===== */
.dateRow{display:flex;align-items:center;gap:8px;margin-top:10px}
.dateRow input[type=date]{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text);font-size:12px;outline:none;color-scheme:dark}
.filterRow{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.filterRow::-webkit-scrollbar{display:none}

/* ===== 新增：收藏角标/选中框 ===== */
.favBadge{position:absolute;left:8px;top:8px;color:#ffd54a;font-size:14px;background:rgba(0,0,0,.55);border-radius:999px;padding:2px 7px;z-index:3}
.pickBox{position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.8);background:rgba(0,0,0,.35);z-index:4;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.pickBox.on{background:var(--accent);border-color:var(--accent)}
.card.picking .cardImgWrap::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18)}
.card.picking{cursor:pointer}

/* ===== 新增：批量操作条 ===== */
#batchBar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(20,23,30,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px;align-items:center;gap:8px}
#batchBar.show{display:flex}
#batchBar span{flex:1;color:var(--sub);font-size:13px}

/* ===== 新增：回收站 ===== */
#trashView{display:none;padding:0 14px 100px}
#trashView.show{display:block}
.trashHead{display:flex;align-items:center;gap:10px;padding:14px 0}
.trashHead .miniBtn{flex-shrink:0}

/* ===== 新增：统计弹窗 ===== */
#statsMask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:210;align-items:center;justify-content:center;padding:24px}
#statsMask.open{display:flex}
.statsBox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:340px}
.statsBox h3{font-size:17px;margin-bottom:16px}
.statsRow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.statsRow:last-child{border-bottom:none}
.statsRow span:last-child{color:var(--accent2);font-weight:600}

/* ===== 管理功能 ===== */
.addBtn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600}
.miniBtn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--sub)}
.miniBtn.danger{color:#ff6b6b;border-color:rgba(255,107,107,.3)}
.detailActions{display:flex;gap:10px;padding:0 16px 6px}
.detailActions .miniBtn{flex:1;padding:10px;font-size:13px}

/* 编辑弹窗 */
#editMask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:150;overflow-y:auto}
#editMask.open{display:block}
.editBox{max-width:640px;margin:20px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.editBox h2{font-size:18px;margin-bottom:16px}
.editField{margin-bottom:16px}
.editField label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.editField input,.editField textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px;outline:none;font-family:inherit;box-sizing:border-box}
.editField textarea{resize:vertical;min-height:110px;line-height:1.6}
.editField input:focus,.editField textarea:focus{border-color:var(--accent)}
.editField .tip{font-size:11px;color:var(--sub);margin-top:4px}
.editActions{display:flex;gap:10px;margin-top:6px}
.editActions button{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:600}
.saveBtn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.cancelBtn{background:var(--card2);border:1px solid var(--line);color:var(--sub)}
.delBtn{background:rgba(255,107,107,.12);color:#ff6b6b;border:1px solid rgba(255,107,107,.3)}

/* 编辑图片区 */
.editImgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.editImg{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--card2)}
.editImg img{width:100%;height:100%;object-fit:cover;display:block}
.editImg .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:13px;line-height:24px;text-align:center}
.editImg .newTag{position:absolute;left:5px;bottom:5px;background:rgba(61,220,151,.9);color:#000;font-size:10px;padding:2px 6px;border-radius:4px}
.addImgBox{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;cursor:pointer;text-align:center;padding:8px}

/* 删除确认 */
#confirmMask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:250;align-items:center;justify-content:center;padding:24px}
#confirmMask.open{display:flex}
.confirmBox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;width:100%;max-width:320px;text-align:center}
.confirmBox h3{font-size:17px;margin-bottom:10px}
.confirmBox p{color:var(--sub);font-size:13px;margin-bottom:20px;line-height:1.6}
.confirmBtns{display:flex;gap:10px}
.confirmBtns button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600}
.confirmBtns .ok{background:#ff6b6b;color:#fff}
.confirmBtns .no{background:var(--card2);border:1px solid var(--line);color:var(--sub)}
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="active">
  <div class="loginBox">
    <h1>提示词图库</h1>
    <div class="sub">登录后查看你的 AI 生图提示词库</div>
    <div class="field"><label>邮箱</label><input type="email" id="loginEmail" value="admin@promptgallery.com" autocomplete="username"></div>
    <div class="field"><label>密码</label><input type="password" id="loginPwd" placeholder="密码" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="err" id="loginErr"></div>
    <div class="hint">登录信息 = Supabase 账号（创建时设定）</div>
  </div>
</div>

<!-- 主界面 -->
<div id="mainView">
  <header>
    <div class="headerRow">
      <h1>📚 提示词图库</h1>
      <button class="miniBtn" onclick="toggleBatch()">批量</button>
      <button class="miniBtn" onclick="openRandom()">🎲 随机</button>
      <button class="miniBtn" onclick="openStats()">📊 统计</button>
      <button class="addBtn" onclick="openNew()">＋ 新增</button>
      <button id="logoutBtn" onclick="doLogout()">退出</button>
    </div>
    <input id="searchBar" placeholder="搜索关键词 / 标签…" oninput="render()">
    <div class="dateRow">
      <input type="date" id="dateFrom" onchange="render()">
      <span style="color:var(--sub);font-size:12px">~</span>
      <input type="date" id="dateTo" onchange="render()">
      <button class="miniBtn" onclick="clearDates()">清除</button>
    </div>
    <div class="filterRow">
      <button class="tagChip on" id="fAll" onclick="setImgFilter('')">全部</button>
      <button class="tagChip" id="fHas" onclick="setImgFilter('has')">有图</button>
      <button class="tagChip" id="fNone" onclick="setImgFilter('none')">无图</button>
      <button class="tagChip" id="fFav" onclick="setImgFilter('fav')">★ 收藏</button>
      <span style="flex:1"></span>
      <button class="tagChip" onclick="showTrash()">🗑 回收站</button>
      <button class="tagChip" onclick="saveAllCurrent()">💾 保存全部图片</button>
      <button class="tagChip" onclick="exportTxt()">导出TXT</button>
      <button class="tagChip" onclick="exportJson()">备份</button>
      <button class="tagChip" onclick="document.getElementById('importFile').click()">导入</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJson(this)">
      <input type="file" id="quickFileInput" accept="image/*" multiple style="display:none" onchange="quickFileChange(this)">
    </div>
  </header>
  <div class="tagRow" id="tagRow"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
  <!-- 批量操作条 -->
  <div id="batchBar">
    <span id="batchCount">已选 0 项</span>
    <button class="miniBtn" onclick="batchDelete()">删除</button>
    <button class="miniBtn" onclick="batchExport()">导出</button>
    <button class="miniBtn" onclick="batchSaveImgs()">保存图片</button>
    <button class="miniBtn" onclick="toggleBatch(false)">退出</button>
  </div>
  <!-- 回收站视图 -->
  <div id="trashView">
    <div class="trashHead">
      <button class="miniBtn" onclick="showTrash(false)">← 返回图库</button>
      <span id="trashCount" style="color:var(--sub);font-size:12px"></span>
      <button class="miniBtn danger" onclick="emptyTrash()">清空回收站</button>
    </div>
    <div id="trashList"></div>
  </div>
</div>

<!-- 统计弹窗 -->
<div id="statsMask">
  <div class="statsBox" id="statsBox"></div>
</div>

<!-- 详情 -->
<div id="detailMask">
  <div class="detailBox">
    <div class="detailHead">
      <button class="back" onclick="closeDetail()">✕</button>
      <div class="t">记录详情</div>
      <button class="copyBtn" onclick="copyDetail()">复制全套</button>
    </div>
    <div class="detailActions">
      <button class="miniBtn" id="favBtn" onclick="toggleFav()">★ 收藏</button>
      <button class="miniBtn" onclick="openEdit()">✏️ 编辑记录</button>
      <button class="miniBtn danger" onclick="askDelete()">🗑 删除</button>
    </div>
    <div class="detailImgs" id="detailImgs"></div>
    <div class="detailSection">
      <h3>主提示词 <span style="font-size:11px;color:var(--sub);font-weight:400">（点击可直接修改）</span></h3>
      <div class="promptText" id="detailPrompt" onclick="openEdit()" style="cursor:pointer"></div>
    </div>
    <div class="detailSection" id="detailVariants"></div>
    <div class="detailSection" id="detailTags"></div>
    <div class="detailSection" style="padding-bottom:30px">
      <button class="bigBtn" onclick="copyDetail()">📋 复制完整提示词</button>
      <div class="detailMeta" id="detailMeta"></div>
    </div>
  </div>
</div>

<!-- 全屏 -->
<div id="zoomMask"><img id="zoomImg" alt=""><div id="zoomCount"></div><div id="zoomHint">上下滑动切换 · 滑到头关闭</div><button id="zoomClose">×</button></div>
<div class="toast" id="toast"></div>
<!-- 上传/保存中遮罩 -->
<div class="loadingMask" id="loadingMask" style="display:none"><div class="loadingBox"><div class="spin"></div><p id="loadingText">处理中…</p></div></div>

<!-- 编辑/新增弹窗 -->
<div id="editMask">
  <div class="editBox">
    <h2 id="editTitle">新增记录</h2>
    <div class="editField">
      <label>图片</label>
      <div class="editImgs" id="editImgs"></div>
      <input type="file" id="editFileInput" accept="image/*" multiple style="display:none" onchange="editFileChange(this)">
      <div class="tip" style="margin-top:8px">原图直传，不压缩</div>
    </div>
    <div class="editField">
      <div class="editLabelRow"><label>提示词</label><button type="button" class="pasteBtn" onclick="pasteClipboard()">📋 粘贴剪贴板</button></div>
      <textarea id="editPrompt" placeholder="输入提示词内容…" oninput="scheduleAutoTag()"></textarea>
    </div>
    <div class="editField">
      <label>标签（用逗号或顿号分隔，输入提示词后自动生成）</label>
      <input id="editTags" placeholder="例如：古风, 写真, 韩系" oninput="editingDirty=true">
    </div>
    <div class="editField">
      <label>扩展提示词（每行一条）</label>
      <textarea id="editVariants" placeholder="每条扩展提示词占一行…" oninput="editingDirty=true"></textarea>

function toHexBytes(u8){ return Array.from(u8).map(function(b){ return b.toString(16).padStart(2,'0'); }).join(''); }
async function sha256Hex(str){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return toHexBytes(new Uint8Array(buf));
}
async function hmacBytes(keyBytes, data){
  if(typeof keyBytes === 'string'){ keyBytes = new TextEncoder().encode(keyBytes); }
  var k = await crypto.subtle.importKey('raw', keyBytes, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(data)));
}
async function r2Request(method, key, bodyBytes){
  var host = new URL(R2_ENDPOINT).host;
  var now = new Date();
  var amzDate = now.toISOString().replace(/[:-]/g,'').replace(/\.\d{3}/,'');
  var dateStamp = amzDate.slice(0,8);
  var region = 'auto', service = 's3';
  var payloadHash = bodyBytes && bodyBytes.length ? toHexBytes(new Uint8Array(await crypto.subtle.digest('SHA-256', bodyBytes))) : 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855';
  var encKey = key.split('/').map(encodeURIComponent).join('/');
  var canonicalHeaders = 'host:'+host+'\nx-amz-content-sha256:'+payloadHash+'\nx-amz-date:'+amzDate+'\n';
  var signedHeaders = 'host;x-amz-content-sha256;x-amz-date';
  var canonicalRequest = [method, '/'+R2_BUCKET+'/'+encKey, '', canonicalHeaders, signedHeaders, payloadHash].join('\n');
  var scope = dateStamp+'/'+region+'/'+service+'/aws4_request';
  var stringToSign = ['AWS4-HMAC-SHA256', amzDate, scope, await sha256Hex(canonicalRequest)].join('\n');
  var kDate = await hmacBytes('AWS4'+R2_SK, dateStamp);
  var kRegion = await hmacBytes(kDate, region);
  var kService = await hmacBytes(kRegion, service);
  var kSigning = await hmacBytes(kService, 'aws4_request');
  var signature = toHexBytes(await hmacBytes(kSigning, stringToSign));
  var auth = 'AWS4-HMAC-SHA256 Credential='+R2_AK+'/'+scope+', SignedHeaders='+signedHeaders+', Signature='+signature;
  var resp = await fetch(R2_ENDPOINT+'/'+R2_BUCKET+'/'+encKey, {
    method: method,
    headers: { 'Authorization': auth, 'x-amz-date': amzDate, 'x-amz-content-sha256': payloadHash },
    body: bodyBytes && bodyBytes.length ? bodyBytes : undefined
  });
  return resp;
}

/* ---- 自动续期：用 refresh_token 换新 access_token ---- */
function refreshToken(){
  var rt = getRefresh();
  if(!rt) return Promise.resolve(false);
  return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: rt })
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.access_token){
      setToken(data.access_token);
      if(data.refresh_token) setRefresh(data.refresh_token);
      return true;
    }
    clearToken(); clearRefresh();
    return false;
  }).catch(function(){ return false; });
}

/* ---- API 封装 ---- */
function apiFetch(path, opts){
  opts = opts || {};
  var headers = {
    'apikey': ANON_KEY,
    'Authorization': 'Bearer ' + (opts.token || ANON_KEY),
    'Content-Type': 'application/json'
  };
  if(opts.prefer) headers['Prefer'] = opts.prefer;
  return fetch(SUPABASE_URL + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if(opts.raw) return r;
    return r.json()['catch'](function(){ return {}; });
  });
}

/* ---- 过滤 ---- */
function filtered(){
  var kw = (document.getElementById('searchBar').value || '').trim().toLowerCase();
  var dFrom = document.getElementById('dateFrom').value;
  var dTo = document.getElementById('dateTo').value;
  return records.filter(function(r){
    if(isTrash(r)) return false; // 回收站记录不在图库显示
    var tags = r.tags || [];
    if(currentTag && tags.indexOf(currentTag) < 0) return false;
    var imgs = r.images || [];
    if(imgFilter === 'has' && imgs.length === 0) return false;
    if(imgFilter === 'none' && imgs.length > 0) return false;
    if(imgFilter === 'fav' && tags.indexOf('__fav') < 0) return false;
    var d = (r.created_at||'').slice(0,10);
    if(dFrom && d < dFrom) return false;
    if(dTo && d > dTo) return false;
    if(!kw) return true;
    var text = ((r.prompt_text||'') + ' ' + tags.join(' ')).toLowerCase();
    return text.indexOf(kw) >= 0;
  });
}

    navigator.clipboard.writeText(text).then(ok)['catch'](function(){ fallbackCopy(text, ok); });

var zoomImgs = [], zoomIdx = 0;
function zoomList(idx){

  zoomImgsOf(rec, 0);
}

function zoomImgsOf(rec, i){
  var imgs = (rec.images||[]).map(function(p){ return signedCache[p]||''; }).filter(Boolean);
  if(!imgs.length) return;
  zoomImgs = imgs;
  zoomIdx = Math.min(i||0, imgs.length-1);
  showZoom(zoomIdx);
}
function zoom(url){ zoomImgs = [url]; zoomIdx = 0; showZoom(0); }
function showZoom(i){
  zoomIdx = i;
  document.getElementById('zoomImg').src = zoomImgs[i];
  document.getElementById('zoomCount').textContent = (i+1) + ' / ' + zoomImgs.length;
  document.getElementById('zoomMask').classList.add('open');

function closeZoom(){
  document.getElementById('zoomMask').classList.remove('open');
}
(function(){
  var zm = document.getElementById('zoomMask');
  var sy = null, sx = null, moved = false;
  zm.addEventListener('touchstart', function(e){
    sy = e.touches[0].clientY; sx = e.touches[0].clientX; moved = false;
  }, {passive:true});
  zm.addEventListener('touchmove', function(e){
    if(sy !== null){
      var d = e.touches[0].clientY - sy;
      if(Math.abs(d) > 8) moved = true;
    }
  }, {passive:true});
  zm.addEventListener('touchend', function(e){
    if(sy === null) return;
    var dy = e.changedTouches[0].clientY - sy;
    var dx = e.changedTouches[0].clientX - sx;
    sy = null;
    if(!moved && Math.abs(dy) < 15 && Math.abs(dx) < 15) return;
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) >= 15){
      if(dy < 0){ if(zoomIdx < zoomImgs.length-1){ showZoom(zoomIdx+1); } else { closeZoom(); } }
      else { if(zoomIdx > 0){ showZoom(zoomIdx-1); } else { closeZoom(); } }
    }
  }, {passive:true});
  var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if(!isTouch){
    zm.addEventListener('click', closeZoom);
  }
  document.getElementById('zoomClose').addEventListener('click', closeZoom);
})();

function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var d = new Date().getTime();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = (d + Math.random()*16) % 16 | 0; d = Math.floor(d/16);
    return (c==='x' ? r : (r&0x3|0x8)).toString(16);
  });
}

/* storage 上传（直传 Cloudflare R2，SigV4） */
function uploadToStorage(path, file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var bytes = new Uint8Array(reader.result);
      r2Request('PUT', path, bytes).then(function(resp){
        if(resp.ok){ resolve({ ok: true }); }
        else { return resp.text().then(function(t){ throw new Error('HTTP '+resp.status+' '+(t||'').slice(0,80)); }); }
      }).catch(function(e){ reject(e); });
    };
    reader.onerror = function(){ reject(new Error('读取文件失败')); };
    reader.readAsArrayBuffer(file);
  });
}
function deleteFromStorage(path){
  // 直删 R2 对象
  return r2Request('DELETE', path, null).then(function(resp){
    if(resp.ok || resp.status === 404) return { ok: true };
    return { ok: false };
  });
}

/* 保存 */
function saveRecord(){
  if(!editing) return;
  var btn = document.getElementById('saveBtn');
  var promptText = document.getElementById('editPrompt').value.trim();
  if(!promptText){ toast('请输入提示词'); return; }
  var tags = document.getElementById('editTags').value.split(/[,，、;；\n]/).map(function(s){ return s.trim(); }).filter(function(s){ return s && s.indexOf('__') !== 0; });
  var variants = document.getElementById('editVariants').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  btn.textContent = '保存中…';
  btn.disabled = true;

  var rid = editing.id || uuid();
  var savedImages = [];
  var uploadTotal = editing.newFiles.length;
  var uploadDone = 0;
  var uploadTasks = editing.newFiles.map(function(f, i){
    var ext = (f.file.name.split('.').pop() || 'png').toLowerCase();
    if(ext.length > 5) ext = 'png';
    var path = 'record-' + rid + '/' + Date.now() + '_' + i + '.' + ext;
    f.path = path;
    return uploadToStorage(path, f.file).then(function(){
      uploadDone++;
      if(uploadTotal > 0){ btn.textContent = '保存中 ' + uploadDone + '/' + uploadTotal; }
      return path;
    });
  });
  // 删除被移除的旧图
  var delTasks = editing.removedImages.map(function(p){ return deleteFromStorage(p); });

  Promise.all(delTasks)['catch'](function(){})
  .then(function(){ return Promise.all(uploadTasks); })
  .then(function(newPaths){
    var images = editing.keepImages.concat(newPaths);
    savedImages = images;
    var payload = {
      user_id: 'cb23b6c5-667a-4426-94f9-5a6c25505619',
      prompt_text: promptText,
      tags: tags,
      variant_prompts: variants,
      images: images
    };
    if(editing.id){
      delete payload.user_id;
      return apiFetch('/rest/v1/prompts?id=eq.' + encodeURIComponent(editing.id), {
        method: 'PATCH', token: getToken(), body: payload, raw: true
      }).then(function(r){ if(!r.ok){ return r.json().then(function(d){ throw new Error(d.message||'保存失败'); }); } return {new:false, id: editing.id}; });
    }else{
      return apiFetch('/rest/v1/prompts', {
        method: 'POST', token: getToken(), body: payload, prefer: 'return=representation', raw: true
      }).then(function(r){
        if(!r.ok){ return r.json().then(function(d){ throw new Error(d.message||'保存失败'); }); }
        return r.json()['catch'](function(){ return []; }).then(function(d){ return {new:true, id: d && d.length ? d[0].id : rid}; });
      });
    }
  }).then(function(res){
    btn.textContent = '保 存'; btn.disabled = false;
    editingDirty = false;
    toast('已保存');
    if(res.new && res.id){ editing.id = res.id; }
    editing.keepImages = savedImages;
    editing.removedImages = [];
    editing.newFiles = [];
    renderEditImgs();
    loadAll();
  })['catch'](function(e){
    btn.textContent = '保 存'; btn.disabled = false;
    askConfirm('保存失败：' + (e && e.message ? e.message : e) + '\n\n请检查网络后重试', null, '知道了');
  });
}

/* ========== 一键保存所有图片 ========== */
function saveAllImages(list){
  var paths = [];
  var seen = {};
  list.forEach(function(r){
    (r.images||[]).forEach(function(p){ if(!seen[p]){ seen[p] = 1; paths.push(p); } });
  });
  if(!paths.length){ toast('当前没有可保存的图片'); return; }
  toast('开始保存 ' + paths.length + ' 张（浏览器可能询问允许下载）…');
  var i = 0;
  function next(){
    if(i >= paths.length){ toast('已保存 ' + paths.length + ' 张图片'); return; }
    var p = paths[i++];
    var url = signedCache[p];
    if(!url){ next(); return; }
    fetch(url).then(function(r){ if(!r.ok) throw new Error('load fail'); return r.blob(); })
    .then(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (p.split('/').pop() || 'img.png');
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      next();
    })['catch'](function(){ next(); });
  }
  next();
}
function saveAllCurrent(){
  if(trashMode){ toast('请在正常视图下使用'); return; }
  saveAllImages(filtered());
}

function downloadFile(name, content, type){
  var blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function today(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function autoTag(){
  var text = document.getElementById('editPrompt').value.trim();
  if(!text){ return; }
  var manual = document.getElementById('editTags').value.split(/[,，、;；\n]/).map(function(s){ return s.trim(); }).filter(function(s){ return s && s.indexOf('__') !== 0; });
  var auto = detectTags(text);
  var merged = manual.slice();
  auto.forEach(function(t){ if(merged.indexOf(t) < 0) merged.push(t); });
  document.getElementById('editTags').value = merged.join(', ');
}
function detectTags(text){
  var t = String(text).toLowerCase();
  var out = [];
  var rules = [
    ['人像','人像'],['写真','写真'],['肖像','人像'],['汉服','汉服'],['古风','古风'],['古装','古装'],
    ['旗袍','旗袍'],['唐装','唐装'],['韩系','韩系'],['日系','日系'],['法式','法式'],['美式','美式'],
    ['夜景','夜景'],['夜晚','夜景'],['海边','海边'],['海滩','海边'],['沙滩','海边'],
    ['室内','室内'],['房间','室内'],['咖啡馆','咖啡'],['咖啡厅','咖啡'],['户外','户外'],['公园','公园'],
    ['街头','街拍'],['街拍','街拍'],['街道','街拍'],['天台','天台'],['屋顶','天台'],
    ['车窗','车窗'],['雨天','雨天'],['雨','雨天'],['雪','雪景'],['樱花','樱花'],['花海','花海'],
    ['胶片','胶片'],['电影感','电影感'],['氛围感','氛围感'],['柔光','柔光'],['逆光','逆光'],['剪影','剪影'],
    ['少女','少女'],['御姐','御姐'],['清纯','清纯'],['甜美','甜美'],['高冷','高冷'],['成熟','成熟'],
    ['性感','性感'],['知性','知性'],['文艺','文艺'],['慵懒','慵懒'],['清冷','清冷'],
    ['长发','长发'],['短发','短发'],['卷发','卷发'],['直发','直发'],['马尾','马尾'],['盘发','盘发'],
    ['运动','运动'],['健身','运动'],['职业','职业'],['职场','职业'],['学生','学生'],['校园','校园'],
    ['婚纱','婚纱'],['婚礼','婚礼'],['舞台','舞台'],['敦煌','敦煌'],['武侠','武侠'],['赛博','赛博朋克'],['朋克','赛博朋克'],
    ['特写','特写'],['全身','全身'],['半身','半身'],['仰拍','仰拍'],['俯拍','俯拍'],
    ['夜景人像','夜景'],['私房','私房'],['居家','居家'],['浴室','浴室'],['镜子','镜子']
  ];
  rules.forEach(function(p){ if(t.indexOf(p[0]) >= 0 && out.indexOf(p[1]) < 0) out.push(p[1]); });
  return out.slice(0, 8);
}

/* ========== 编辑防误触：未保存退出确认 ========== */
function tryCloseEdit(){
  if(editingDirty){
    askConfirm('有未保存的修改，确定退出吗？', function(){ closeEdit(); });
  }else{
    closeEdit();
  }
}

/* ========== 列表页"暂无图片"直传 ========== */
var quickTarget = null;
var quickIdx = -1;
function quickUpload(idx, ev){
  if(ev && ev.stopPropagation) ev.stopPropagation();
  if(batchMode) return;
  var rec = filteredCache[idx];
  if(!rec){ return; }
  quickTarget = rec;
  quickIdx = idx;
  document.getElementById('quickFileInput').click();
}
function quickFileChange(input){
  var files = input.files;
  input.value = '';
  var rec = quickTarget || (quickIdx >= 0 ? filteredCache[quickIdx] : null);
  quickTarget = null;
  quickIdx = -1;
  if(!files || !files.length || !rec) return;
  var rid = rec.id;
  var tasks = [];
  for(var i=0; i<files.length; i++){
    var f = files[i];
    if(f.type && f.type.indexOf('image/') !== 0) continue;
    var ext = (f.name.split('.').pop() || 'png').toLowerCase();
    if(ext.length > 5) ext = 'png';
    var path = 'record-' + rid + '/' + Date.now() + '_' + i + '.' + ext;
    (function(p, ff){ tasks.push(uploadToStorage(p, ff).then(function(){ return p; })); })(path, f);
  }
  if(!tasks.length){ toast('未识别图片格式，请换一张试试'); return; }
  toast('上传中…');
  showLoading('图片上传中，请稍候…');
  Promise.all(tasks).then(function(paths){
    var imgs = (rec.images||[]).concat(paths);
    return apiFetch('/rest/v1/prompts?id=eq.' + encodeURIComponent(rec.id), {
      method: 'PATCH', token: getToken(), body: { images: imgs }, raw: true
    });
  }).then(function(r){
    hideLoading();
    if(r && !r.ok){ return r.json().then(function(d){ throw new Error(d.message||'保存失败'); }); }
    toast('已上传并自动保存');
    if(imgFilter === 'none'){
      imgFilter = '';
      document.getElementById('fNone').classList.remove('on');
      document.getElementById('fAll').classList.add('on');
      toast('上传成功，已切回「全部」');
    }
    rec.images = imgs;
    detail = rec;
    loadAll();
    openEdit();
  })['catch'](function(e){
    hideLoading();
    askConfirm('上传失败：' + (e && e.message ? e.message : e) + '\n\n请检查网络后重试，或改用「修改 → 添加图片」方式上传', null, '知道了');
  });
}
